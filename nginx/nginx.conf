# ==============================================================================
# Nginx Configuration for Docker Compose Production
# Mengatur reverse proxy Gunicorn, serving static/media files, dan SSL Let's Encrypt
# ==============================================================================

upstream django_upstream {
    server web:8000;
}

# Redirect HTTP ke HTTPS + ACME Challenge untuk Certbot
server {
    listen 80;
    server_name ${DOMAIN_NAME};

    # Endpoint untuk validasi Let's Encrypt (Certbot HTTP-01 Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect seluruh request HTTP lain ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Server HTTPS Utama
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN_NAME};

    # Sertifikat SSL dari Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;

    # Pengaturan SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Ukuran maksimum unggahan file
    client_max_body_size 25M;

    # Static files — disajikan langsung oleh Nginx dari volume
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files (user uploads)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Blokir akses ke file sensitif
    location ~ /\.(env|git|py|sqlite3) {
        deny all;
        return 404;
    }

    # Proxy ke container Django Gunicorn
    location / {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
