{# US-007: Lupa password — input email #}
{% load static %}
<c-layout.blank title="Lupa Password">
    <c-slot name="head">
        <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
    </c-slot>

    <div class="auth-card">
        <div class="auth-card__header">
            <div class="auth-card__brand"><strong>{{ APP_BRAND_SHORT }}</strong></div>
            <h1 class="auth-card__title">Lupa Password</h1>
            <p class="auth-card__subtitle">Masukkan email Anda. Kami kirim link reset password.</p>
        </div>

        <form method="post" class="auth-card__form" novalidate>
            {% csrf_token %}

            <c-rdp.form.input
                name="email"
                type="email"
                label="Email"
                value="{{ form.email.value|default:'' }}"
                error="{{ form.email.errors.0|default:'' }}"
                required="true"
                autofocus="true"
                placeholder="nama@contoh.com"
            />

            {% if form.non_field_errors %}
                <c-rdp.alert type="error">{{ form.non_field_errors.0 }}</c-rdp.alert>
            {% endif %}

            <c-rdp.button type="submit" variant="primary" size="md" style="width:100%">
                Kirim Link Reset
            </c-rdp.button>
        </form>

        <p class="auth-card__alt-link">
            Ingat password? <a href="{% url 'accounts:login' %}">Masuk</a>
        </p>
    </div>
</c-layout.blank>
