<c-vars align="left" />
<div x-data="{ dropdownOpen: false }" class="rdp-dropdown" {{ attrs }}>
  <div @click="dropdownOpen = !dropdownOpen">
    {{ trigger }}
  </div>

  <div x-show="dropdownOpen" 
       @click.away="dropdownOpen = false"
       class="rdp-dropdown__menu rdp-dropdown__menu--{{ align }}"
       x-transition
       style="display: none;">
    {{ slot }}
  </div>
</div>
