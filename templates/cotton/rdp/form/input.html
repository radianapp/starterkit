<c-vars name="" label="" type="text" help_text="" error="" required=False disabled=False value="" placeholder="" prefix="" suffix="" />
<div class="rdp-form-field">
  {% if label %}
    <label for="{{ name }}" class="rdp-form-field__label">
      {{ label }}
      {% if required %}<span class="rdp-form-field__required">*</span>{% endif %}
    </label>
  {% endif %}
  
  {% if prefix or suffix %}
    <div class="rdp-input-group" {% if error %}aria-invalid="true"{% endif %}>
      {% if prefix %}<span class="rdp-input-addon rdp-input-addon--left">{{ prefix }}</span>{% endif %}
      <input type="{{ type }}" name="{{ name }}" id="{{ name }}" class="rdp-input"
             {% if value %}value="{{ value }}"{% endif %}
             {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
             {% if disabled %}disabled{% endif %}
             {{ attrs }}>
      {% if suffix %}<span class="rdp-input-addon rdp-input-addon--right">{{ suffix }}</span>{% endif %}
    </div>
  {% else %}
    <input type="{{ type }}" name="{{ name }}" id="{{ name }}" class="rdp-input"
           {% if error %}aria-invalid="true"{% endif %}
           {% if value %}value="{{ value }}"{% endif %}
           {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
           {% if disabled %}disabled{% endif %}
           {{ attrs }}>
  {% endif %}
  
  {% if error %}
    <div class="rdp-form-field__error"><span>⚠</span>{{ error }}</div>
  {% elif help_text %}
    <div class="rdp-form-field__help">{{ help_text }}</div>
  {% endif %}
</div>
