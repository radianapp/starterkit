<c-vars name="" label="" disabled=False checked=False value="on" />
<label class="rdp-switch" {{ attrs }}>
  <input type="checkbox" name="{{ name }}" class="rdp-switch__input" 
         value="{{ value }}"
         {% if checked %}checked{% endif %}
         {% if disabled %}disabled{% endif %}>
  <span>{{ label }}{{ slot }}</span>
</label>
