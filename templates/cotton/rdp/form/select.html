<c-vars name="" label="" help_text="" error="" required=False disabled=False />
<div class="rdp-form-field">
  {% if label %}
    <label for="{{ name }}" class="rdp-form-field__label">
      {{ label }}
      {% if required %}<span class="rdp-form-field__required">*</span>{% endif %}
    </label>
  {% endif %}
  
  <select name="{{ name }}" id="{{ name }}" class="rdp-select"
          {% if error %}aria-invalid="true"{% endif %}
          {% if disabled %}disabled{% endif %}
          {{ attrs }}>
    {{ slot }}
  </select>
  
  {% if error %}
    <div class="rdp-form-field__error"><span>⚠</span>{{ error }}</div>
  {% elif help_text %}
    <div class="rdp-form-field__help">{{ help_text }}</div>
  {% endif %}
</div>
