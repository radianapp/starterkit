<c-vars variant="info" title="" dismissible=False />
<div class="rdp-alert rdp-alert--{{ variant }} {{ class }}" role="alert" {{ attrs }} {% if dismissible %}x-data="{ show: true }" x-show="show"{% endif %}>
  <div class="rdp-alert__icon">
    {% if variant == 'success' %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12.5 2.5 2.5 4.5-5"></path></svg>
    {% elif variant == 'warning' %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 3 19h18L12 4z"></path><path d="M12 10v4M12 16.8v.2"></path></svg>
    {% elif variant == 'danger' %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.2"></path></svg>
    {% else %}
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5v.2"></path></svg>
    {% endif %}
  </div>
  <div class="rdp-alert__content">
    {% if title %}<div class="rdp-alert__title">{{ title }}</div>{% endif %}
    <div class="rdp-alert__desc">{{ slot }}</div>
  </div>
  {% if dismissible %}
    <button class="rdp-alert__dismiss" aria-label="Dismiss" @click="show = false">×</button>
  {% endif %}
</div>
