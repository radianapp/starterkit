services:
  # 1. Django Web Application (Gunicorn WSGI)
  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --timeout 90"
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M

  # 2. Celery Worker (Background Tasks)
  celery_worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: celery -A config worker --loglevel=INFO -Q default,high_priority
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - media_volume:/app/media
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. Celery Beat (Periodic Scheduler)
  celery_beat:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: celery -A config beat --loglevel=INFO
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      - db
      - redis

  # 3.5. Flower (Celery Monitoring)
  flower:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: celery -A config flower
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - db
      - celery_worker

  # 4. Database PostgreSQL
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rdp_db}
      POSTGRES_USER: ${DB_USER:-rdpuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rdpuser} -d ${DB_NAME:-rdp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Redis (Cache & Celery Broker)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # 6. Nginx Web Server & SSL Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web

  # 7. Certbot (Let's Encrypt Auto-Renewal SSL)
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_conf:
  certbot_www:
