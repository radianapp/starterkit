[project]
name = "rdp-starter-kit"
version = "0.6.2"
description = "Production-ready Django starter template for Radian Data Platform (RDP)"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "Django>=4.2,<5.2",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "whitenoise>=6.6.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "django-cotton>=2.0.0",
    "django-cors-headers>=4.3.0",
    "djangorestframework>=3.14.0",
    "python-dateutil>=2.8.0",
    "django-jazzmin>=3.0.5",
    "drf-spectacular>=0.27.0",
    "django-storages[s3]>=1.14.0",
    "django-simple-history>=3.12.0",
    "webauthn>=3.0.0",
    "django-allauth[socialaccount]>=65.18.0",
    "sentry-sdk>=2.68.0",
    "django-environ>=0.14.0",
    "django-anymail[mailgun,resend,sendgrid]>=15.1",
    "django-csp>=4.0",
    "django-celery-beat>=2.9.0",
    "flower>=2.0.1",
]

[project.scripts]
rdp = "scripts.rdp_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "django-debug-toolbar>=4.1.0",
    "django-extensions>=3.2.0",
    "faker>=19.0.0",  # Generate fake data for testing
    "pre-commit>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "django-debug-toolbar>=4.1.0",
    "django-extensions>=3.2.0",
    "faker>=19.0.0",
    "pre-commit>=3.5.0",
    "mypy>=2.3.0",
    "django-stubs>=6.1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--cov=apps --cov-report=html --cov-report=term-missing --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "smoke: marks tests as smoke tests",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/apps.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "migrations",
    ".pytest_cache",
    ".ruff_cache",
    "scripts/app_template",
    "scripts/xrdp_new.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "A",      # flake8-builtins
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long
    "B008",   # Do not perform function calls in argument defaults
    "C901",   # McCabe complexity (CLI command functions naturally have high branching)
    "RUF001", # Unicode character in strings (e.g. Indonesian docstrings, dashes, arrows)
    "RUF002", # Unicode character in docstrings
    "RUF003", # Unicode character in comments
    "RUF012", # Mutable class attributes (Django Model/Form/Admin attributes like list_display, fields)
    "RUF013", # PEP 484 implicit Optional
    "F405",   # Undefined name from star import (Django dev/prod settings inheritance)
    "A001",   # Shadowing builtins (Django models/views frequently use `id`, `type`, `format`)
    "A002",
    "A003",
    "B904",   # Exception chaining (raise ... from err)
    "C401",   # Set comprehension vs generator
    "W291",   # Trailing whitespace
    "W293",   # Blank line contains whitespace
    "E402",   # Module level import not at top of file
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "config*", "apps*"]

[tool.setuptools.package-data]
"*" = ["*.py", "**/*.py"]

[tool.rdp]
project_type = "rdp-starter-kit"
schema_version = 1
framework_version = "0.6.1"
apps_dir = "apps"
settings_file = "config/settings/base.py"
urls_file = "config/urls.py"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"
