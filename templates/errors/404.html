{# Error 404 — Page Not Found #}
{% load static %}
{% load cotton %}

<c-layout.blank title="404 - Halaman Tidak Ditemukan" navbar_brand="{{ SITE_NAME }}">
    <c-slot name="head">
        <link rel="stylesheet" href="{% static 'css/errors.css' %}">
    </c-slot>

    <div class="error-page">
        <div class="error-container">
            <c-rdp.card>
                <div class="rdp-card__body error-content">
                    <div class="error-icon">🔍</div>
                    <h1 class="error-title">404 — Page Not Found</h1>
                    <p class="error-message">
                        The page you're looking for doesn't exist or has been moved.
                        <br />Please check the URL and try again.
                    </p>

                    <div class="error-actions">
                        <c-rdp.button variant="primary" onclick="window.location.href='/'">
                            ← Go back to home
                        </c-rdp.button>
                        <c-rdp.button variant="secondary" onclick="window.location.href='/dashboard/'">
                            Go to Dashboard
                        </c-rdp.button>
                    </div>
                </div>
            </c-rdp.card>
        </div>
    </div>
</c-layout.blank>
