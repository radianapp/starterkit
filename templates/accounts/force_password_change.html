<c-layout.base title="Ganti Password">
    <div class="rdp-auth-container" style="max-width: 400px; margin: 40px auto; padding: 24px;">
        <c-rdp.card>
            <div style="text-align: center; margin-bottom: 24px;">
                <h2 style="margin: 0 0 8px 0;">Selamat Datang!</h2>
                <p class="rdp-text-muted" style="margin: 0; font-size: 14px;">
                    Anda harus mengganti password Anda sebelum melanjutkan ke dalam sistem.
                </p>
            </div>
            
            <form method="post" action="{% url 'accounts:force_password_change' %}">
                {% csrf_token %}
                
                {% for field in form %}
                    <div style="margin-bottom: 16px;">
                        <label for="{{ field.id_for_label }}" style="display: block; font-weight: 600; margin-bottom: 8px;">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.help_text %}
                            <p style="font-size: 12px; color: var(--rdp-text-muted); margin-top: 4px;">{{ field.help_text|safe }}</p>
                        {% endif %}
                        {% for error in field.errors %}
                            <p style="color: var(--rdp-danger); font-size: 13px; margin-top: 4px;">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}
                
                <div style="margin-top: 24px;">
                    <c-rdp.button type="submit" color="primary" style="width: 100%;">Ubah Password</c-rdp.button>
                </div>
            </form>
        </c-rdp.card>
    </div>
</c-layout.base>
