{# US-007: Lupa password — konfirmasi email terkirim #}
{% load static %}
<c-layout.blank title="Email Terkirim">
    <c-slot name="head">
        <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
    </c-slot>

    <div class="auth-layout">
        <div class="auth-box">
            <div class="auth-box__inner" style="text-align: center;">
                <div class="reset-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="m3 7 9 6 9-6"></path>
                    </svg>
                </div>
                <h1 class="auth-box__title" style="font-size: 22px;">Check your inbox</h1>
                <p class="auth-box__subtitle" style="margin-bottom: 20px;">
                    If the email exists in our system, a reset link is on its way. Same message either way — we don't reveal which emails exist.
                </p>
                
                <a href="{% url 'accounts:password_reset' %}" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none; height: 42px; padding: 0 18px; font-size: 13.5px; font-weight: 600; font-family: inherit; color: #1C1B18; background: #FFFFFF; border: 1px solid #D2CEC6; border-radius: 9px; cursor: pointer;">
                    Resend email
                </a>
                
                <div class="auth-box__alt-link" style="margin-top: 16px;">
                    <a href="{% url 'accounts:login' %}">Kembali ke login</a>
                </div>
            </div>
        </div>
    </div>
</c-layout.blank>
