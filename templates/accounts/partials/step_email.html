{# US-004: Register wizard — Step 0: Email #}
<form
    hx-post="{% url 'accounts:register' %}"
    hx-target="#wizard-content"
    hx-swap="innerHTML"
    hx-indicator="#wizard-spinner"
    class="auth-form"
    novalidate
>
    {% csrf_token %}

    <div style="display: flex; flex-direction: column; gap: 7px;">
        <label>Work email</label>
        <input 
            name="email" 
            type="email" 
            placeholder="nama@domain.com"
            value="{{ form.email.value|default:'' }}"
            {% if form.email.errors %}aria-invalid="true"{% endif %}
            required autofocus>
        
        {% if form.email.errors %}
            <div style="display: flex; gap: 6px; align-items: baseline; font-size: 12px; line-height: 1.5; color: #B3382D; font-weight: 500;">
                <span>⚠</span>{{ form.email.errors.0 }}
            </div>
        {% endif %}
    </div>

    {% if form.non_field_errors %}
        <div style="display: flex; gap: 6px; align-items: baseline; font-size: 12px; line-height: 1.5; color: #B3382D; font-weight: 500; margin-top: 4px;">
            <span>⚠</span>{{ form.non_field_errors.0 }}
        </div>
    {% endif %}

    {% if TURNSTILE_ENABLED %}
    <div class="cf-turnstile" data-sitekey="{{ TURNSTILE_SITE_KEY }}" data-size="flexible" style="margin-top: 10px;"></div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {% endif %}

    <button type="submit" style="margin-top: 12px;">Create account</button>

    <div id="wizard-spinner" class="htmx-indicator" style="text-align: center; margin-top: 10px; font-size: 13px; color: #6B665E;">
        Memproses...
    </div>
</form>
