{# US-007: Reset password — selesai, redirect ke login #}
{% load static %}
<c-layout.blank title="Password Berhasil Direset">
    <c-slot name="head">
        <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
    </c-slot>

    <div class="auth-card">
        <div class="auth-card__header">
            <div class="auth-card__brand"><strong>{{ APP_BRAND_SHORT }}</strong></div>
            <h1 class="auth-card__title">Password Berhasil Diubah</h1>
        </div>

        <c-rdp.alert variant="success">
            Password Anda sudah diperbarui. Silakan login dengan password baru.
        </c-rdp.alert>

        <div style="margin-top: 1.25rem;">
            <c-rdp.button href="{% url 'accounts:login' %}" variant="primary" size="md" style="width:100%">
                Masuk Sekarang
            </c-rdp.button>
        </div>
    </div>
</c-layout.blank>
